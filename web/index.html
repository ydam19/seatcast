<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>앉을각 · 2호선 자리 예보</title>
  <meta name="description" content="2호선에서 어느 칸, 어느 문 앞에 서야 빨리 앉을 수 있는지 알려드립니다.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand">
        <div>
          <h1>앉을각</h1>
          <p class="tagline">1~8호선 칸·문별 자리 예보</p>
        </div>
      </div>
    </header>

    <form class="panel inputs" id="form" autocomplete="off">
      <div class="place">
        <span class="place-label">타는 곳</span>
        <div class="place-row">
          <select id="fromLine" class="line-select" aria-label="타는 호선"></select>
          <select id="from" aria-label="타는 역"></select>
        </div>
      </div>
      <button type="button" class="swap" id="swap" aria-label="타는 곳과 내리는 곳 바꾸기">⇅</button>
      <div class="place">
        <span class="place-label">내리는 곳</span>
        <div class="place-row">
          <select id="toLine" class="line-select" aria-label="내리는 호선"></select>
          <select id="to" aria-label="내리는 역"></select>
        </div>
      </div>
      <div class="when-row">
        <div class="field">
          <span>요일</span>
          <div class="segctl" id="daytype" role="radiogroup" aria-label="요일"></div>
        </div>
        <label class="field">
          <span>탈 열차</span>
          <select id="train" aria-label="탈 열차 (출발 시각과 행선지)"></select>
        </label>
      </div>
      <div class="live" id="live" hidden aria-live="polite"></div>
    </form>

    <section id="game" class="game" aria-label="자리 잡기 시뮬레이션"></section>

    <section id="result" aria-live="polite"></section>

    <footer class="foot">
      <p>
        데이터: 서울교통공사 지하철 혼잡도 정보(2026.9.30 기준), 서울특별시 역별 시간대별 승하차 인원(2025.11~2026.10),
        서울교통공사 빠른하차정보, 서울특별시 역별 열차 시간표. 칸·문별 분배는 계단·에스컬레이터 위치를 바탕으로 한 추정입니다.
        자리 예보는 서울교통공사 운영 구간(1~8호선)만 제공하며, 9호선은 경로 안내만 합니다.
        출발·도착 시각과 환승 열차는 시간표 기준이며 실제 운행은 늦어질 수 있습니다.
      </p>
    </footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
